<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miro → Lovable MCP Button</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #ffffff;
    }
    .hint {
      max-width: 560px;
      font-size: 14px;
      line-height: 1.45;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    code {
      padding: 1px 4px;
      border-radius: 4px;
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <div class="hint">
    <h1>Miro → Lovable MCP Button</h1>
    <p>
      Diese Miro-App legt auf dem Board einen Lovable-Button an. Der Button öffnet Lovable
      mit einem Initial-Prompt, der Lovable anweist, den verbundenen Miro-MCP-Server zu nutzen.
    </p>
    <p>Ziel-Frame im Board: <code>lovable</code></p>
  </div>

  <script>
    (async function init() {
      "use strict";

      // ============================================================
      // CONFIG
      // ============================================================
      const TARGET_FRAME_TITLE = "lovable"; // case-insensitive
      const BUTTON_LABEL_TEXT = "🚀 Lovable: Generate App";
      const BUTTON_SUBTEXT = `Frame: ${TARGET_FRAME_TITLE}`;
      const LOVABLE_BASE_URL = "https://lovable.dev/?autosubmit=true#prompt=";

      const BUTTON_WIDTH = 340;
      const BUTTON_HEIGHT = 120;
      const BUTTON_PADDING = 40;
      const LAUNCH_DEBOUNCE_MS = 2500;

      const APPDATA_BUTTON_ID_KEY = "dt_lovable_button_id_v2";
      const APPDATA_FRAME_ID_KEY = "dt_lovable_frame_id_v2";

      let lastLaunchAt = 0;
      let selectionHandling = false;

      // ============================================================
      // Small helpers
      // ============================================================
      function truncateForMiroNotification(value) {
        const text = String(value || "").replace(/\s+/g, " ").trim();
        return text.length > 80 ? text.slice(0, 77) + "..." : text;
      }

      async function notifyInfo(message) {
        try {
          await miro.board.notifications.showInfo(truncateForMiroNotification(message));
        } catch (_error) {}
      }

      async function notifyError(message) {
        try {
          await miro.board.notifications.showError(truncateForMiroNotification(message));
        } catch (_error) {}
      }

      function normalizeTitle(value) {
        return String(value || "").trim().toLowerCase();
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function buildBoardUrlFromId(boardId) {
        return `https://miro.com/app/board/${encodeURIComponent(String(boardId || ""))}/`;
      }

      async function getCurrentBoardId() {
        const info = await miro.board.getInfo();
        return info && info.id ? String(info.id) : null;
      }

      // ============================================================
      // Miro AppData helpers
      // ============================================================
      async function getAppDataKey(key) {
        try {
          return await miro.board.getAppData(key);
        } catch (_error) {
          try {
            const all = await miro.board.getAppData();
            return all && typeof all === "object" ? all[key] : undefined;
          } catch (_fallbackError) {
            return undefined;
          }
        }
      }

      async function setAppDataKey(key, value) {
        try {
          await miro.board.setAppData(key, value);
          return true;
        } catch (_error) {
          try {
            await miro.board.setAppData({ [key]: value });
            return true;
          } catch (_fallbackError) {
            return false;
          }
        }
      }

      // ============================================================
      // Lovable prompt
      // ============================================================
      function buildLovablePrompt(boardId) {
        const boardUrl = buildBoardUrlFromId(boardId);

        return [
          `Build a web app using ONLY the content inside the frame titled "${TARGET_FRAME_TITLE}" (case-insensitive) on this Miro board.`,
          ``,
          `Miro MCP is connected in this Lovable workspace.`,
          `Board URL: ${boardUrl}`,
          `Scope: ONLY content inside the frame titled "${TARGET_FRAME_TITLE}". Ignore everything else.`,
          ``,
          `MCP procedure (strict):`,
          ``,
          `1) Call context_explore on the board. Find the frame whose title matches "${TARGET_FRAME_TITLE}" and capture its item id.`,
          ``,
          `2) Call board_list_items filtered to that frame as parent/container.`,
          `   Only include: doc, table.`,
          ``,
          `3) Inside that frame, find EXACTLY ONE Miro Doc (doc-format) named or used as the MASTER SPEC.`,
          `   Call doc_get on that doc.`,
          `   - Treat the returned markdown as the MASTER SPEC and follow it verbatim.`,
          `   - Do not reinterpret or paraphrase it; implement it.`,
          ``,
          `4) Inside that same frame, find a Miro Table named exactly "Voted Criterias".`,
          `   - Treat this table as the ONLY source of the selected criteria subset.`,
          `   - Do NOT read or use sticky notes as criteria inputs.`,
          ``,
          `   The table columns are expected to be:`,
          `   - Criterion`,
          `   - Category`,
          `   - Definition`,
          `   - Why_it_matters`,
          `   - ID`,
          `   - weight`,
          ``,
          `   Parse the table deterministically and use it exactly as specified in the MASTER SPEC.`,
          ``,
          `5) Optional (if present): Inside that same frame, find a SECOND Miro Doc named "Scoring Rulebook".`,
          `   - Call doc_get on it and treat it as an additional deterministic rule catalog for scoring inference (as referenced by the MASTER SPEC).`,
          `   - If it is not present, proceed without it.`,
          ``,
          `6) Build the app end-to-end in Lovable (MVP first), strictly based on:`,
          `   - the MASTER SPEC doc, and`,
          `   - the "Voted Criterias" table (and optional "Scoring Rulebook" doc).`,
          ``,
          `Deliverable:`,
          `- Generate the full working mini-app in Lovable.`,
          `- Keep requirements traceable: reference the Miro doc id (MASTER SPEC) and the table id ("Voted Criterias") you used.`
        ].join("\n");
      }

      function buildLovableUrl(boardId) {
        return LOVABLE_BASE_URL + encodeURIComponent(buildLovablePrompt(boardId));
      }

      // ============================================================
      // Frame and button handling
      // ============================================================
      async function findTargetFrame() {
        const frames = await miro.board.get({ type: ["frame"] });
        const wanted = normalizeTitle(TARGET_FRAME_TITLE);

        if (!Array.isArray(frames)) return null;
        return frames.find((frame) => normalizeTitle(frame && frame.title) === wanted) || null;
      }

      function getButtonContent() {
        return [
          `<p><strong>${escapeHtml(BUTTON_LABEL_TEXT)}</strong></p>`,
          `<p>${escapeHtml(BUTTON_SUBTEXT)}</p>`
        ].join("");
      }

      function shapeLooksLikeLovableButton(shape) {
        const content = String(shape && shape.content ? shape.content : "").toLowerCase();
        return content.includes("lovable") && (content.includes("generate") || content.includes("app"));
      }

      async function getShapeById(id) {
        if (!id) return null;
        try {
          const result = await miro.board.get({ id });
          if (Array.isArray(result)) return result[0] || null;
          return result && typeof result === "object" ? result : null;
        } catch (_error) {
          return null;
        }
      }

      async function findExistingButtonShape() {
        const savedId = await getAppDataKey(APPDATA_BUTTON_ID_KEY);
        const savedShape = await getShapeById(savedId);
        if (savedShape && savedShape.type === "shape") return savedShape;

        const shapes = await miro.board.get({ type: ["shape"] });
        if (!Array.isArray(shapes)) return null;
        return shapes.find(shapeLooksLikeLovableButton) || null;
      }

      function getButtonCoordinates(frame) {
        const frameX = Number.isFinite(frame.x) ? frame.x : 0;
        const frameY = Number.isFinite(frame.y) ? frame.y : 0;
        const frameWidth = Number.isFinite(frame.width) ? frame.width : 1600;
        const frameHeight = Number.isFinite(frame.height) ? frame.height : 900;

        return {
          x: frameX + frameWidth / 2 - BUTTON_WIDTH / 2 - BUTTON_PADDING,
          y: frameY - frameHeight / 2 + BUTTON_HEIGHT / 2 + BUTTON_PADDING
        };
      }

      async function addButtonToFrame(button, frame) {
        try {
          if (button && frame && typeof frame.add === "function") {
            await frame.add(button);
            if (typeof frame.sync === "function") await frame.sync();
          }
        } catch (_error) {}
      }

      async function syncButton(button, boardId) {
        const content = getButtonContent();
        const url = buildLovableUrl(boardId);

        try { button.content = content; } catch (_error) {}
        try { button.linkedTo = url; } catch (_error) {}
        try {
          button.style = button.style && typeof button.style === "object" ? button.style : {};
          button.style.fillColor = "#00C853";
          button.style.borderColor = "#0B8043";
          button.style.borderWidth = 2;
          button.style.color = "#ffffff";
        } catch (_error) {}

        try {
          if (typeof button.sync === "function") await button.sync();
        } catch (_error) {}

        return url;
      }

      async function ensureLovableButton() {
        const boardId = await getCurrentBoardId();
        if (!boardId) {
          await notifyError("No boardId available.");
          return null;
        }

        const frame = await findTargetFrame();
        if (!frame) {
          await notifyError(`Frame "${TARGET_FRAME_TITLE}" not found. Create or rename a frame to "${TARGET_FRAME_TITLE}".`);
          return null;
        }

        await setAppDataKey(APPDATA_FRAME_ID_KEY, frame.id);

        let button = await findExistingButtonShape();
        if (!button) {
          const position = getButtonCoordinates(frame);
          button = await miro.board.createShape({
            content: getButtonContent(),
            shape: "round_rectangle",
            x: position.x,
            y: position.y,
            width: BUTTON_WIDTH,
            height: BUTTON_HEIGHT,
            style: {
              fillColor: "#00C853",
              borderColor: "#0B8043",
              borderWidth: 2,
              color: "#ffffff"
            }
          });
        }

        await syncButton(button, boardId);
        await addButtonToFrame(button, frame);

        if (button && button.id) {
          await setAppDataKey(APPDATA_BUTTON_ID_KEY, button.id);
        }

        return button;
      }

      async function openLovableFromButton() {
        const boardId = await getCurrentBoardId();
        if (!boardId) {
          await notifyError("No boardId available.");
          return;
        }

        const button = await ensureLovableButton();
        if (!button) return;

        const url = await syncButton(button, boardId);

        try {
          window.open(url, "_blank", "noopener,noreferrer");
          await notifyInfo("Lovable opened. If the popup was blocked, use the arrow icon on the button.");
        } catch (_error) {
          await notifyInfo("Lovable link attached. Use the arrow icon on the button.");
        }
      }

      async function isOurButton(selectedItem) {
        if (!selectedItem || selectedItem.type !== "shape") return false;

        const savedId = await getAppDataKey(APPDATA_BUTTON_ID_KEY);
        if (savedId && selectedItem.id === savedId) return true;

        return shapeLooksLikeLovableButton(selectedItem);
      }

      // ============================================================
      // Events
      // ============================================================
      await miro.board.ui.on("selection:update", async (event) => {
        if (selectionHandling) return;
        selectionHandling = true;

        try {
          const items = event && Array.isArray(event.items) ? event.items : [];
          if (items.length !== 1) return;

          const selected = items[0];
          if (!(await isOurButton(selected))) return;

          const now = Date.now();
          if (now - lastLaunchAt < LAUNCH_DEBOUNCE_MS) return;
          lastLaunchAt = now;

          await openLovableFromButton();

          try { await miro.board.deselect(selected.id); } catch (_error) {}
        } catch (error) {
          await notifyError(error && error.message ? error.message : String(error));
        } finally {
          selectionHandling = false;
        }
      });

      await miro.board.ui.on("icon:click", async () => {
        try {
          const button = await ensureLovableButton();
          if (button && button.id) {
            await notifyInfo(`Button ready. Select "${BUTTON_LABEL_TEXT}" on the board.`);
          }
        } catch (error) {
          await notifyError(error && error.message ? error.message : String(error));
        }
      });

      // Bootstrap: create/update the button when the app is loaded on the board.
      try {
        const button = await ensureLovableButton();
        if (button && button.id) {
          await notifyInfo(`Ready. Select "${BUTTON_LABEL_TEXT}" on the board.`);
        }
      } catch (error) {
        await notifyError(error && error.message ? error.message : String(error));
      }
    })();
  </script>
</body>
</html>
